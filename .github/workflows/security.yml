name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.9
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:runtime
      - run: npm run lint
      - run: npm run validate
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run security:browser
      - name: Verify committed dependency inputs
        run: git diff --exit-code -- package-lock.json package.json

  security-workspace:
    name: Security workspace
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    if: always()
    needs: [verify]
    steps:
      - name: Require every runtime and security check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required jobs did not pass: {failed}')
          print('PASS: all runtime, build and dependency checks succeeded')
          PY
